<html>
    <head>
        <title>Variables</title>
    </head>
    <body>
        <h2>Variables in Javascript</h2>
        <p>Variables are used to store a particular value.</p>
        <p id="demo"></p>

        <script>
            var x = 5
            var y = 8
            var z = x + y


            document.getElementById("demo").innerHTML="the value of z is"+z
        </script>
    </body>
</html>
