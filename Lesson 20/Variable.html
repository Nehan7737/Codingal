<html>
    <head>
        <title>Variables in Javascript</title>
    </head>
    <body>
        <h1>The sum of two values</h1>
        <p id="K"></p>
        <script>
            var num1 = 7;
            var num2 = 3;
           var sum = num1 + num2;
            document.getElementById("K").innerHTML="the sum is" + sum;

        </script>
    </body>
