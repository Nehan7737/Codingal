<html>

<head>
    <title>Variables in Javascript</title>
</head>

<body>
    <h1>The sum of two values</h1>
    <p id="sum"></p>
    <script>
        var num1 = 8;
        var num2 = 9;
        var sum = num1 + num2;
        document.getElementById("sum").innerHTML = "the sum is" + sum;

        




    </script>
</body>

</html>
