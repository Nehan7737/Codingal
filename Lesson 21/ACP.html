<html>

<head>

    <title>Carol's Multiplication</title>
</head>

<body>
    <button onclick="multiply(3)">Execute J.S</button>
    <script>
        function multiply(x, y) {


            if (x === undefined) {
                return "Please provide two numbers";
            }


            if (x == undefined) {
                x = 6
            }
            document.write(x * y)
        }
        
    </script>
</body>

</html>
