<html>
    <head>
        <title>A Simple Calculator</title>

    </head>

    <body>



        <h1>Calculator:</h1>


        <p id="add"></p>
        <p id="sub"></p>
        <p id="div"></p>
        <p id="mult"></p>
        <script>

            var a=5;
            var b=4;


            var add=a+b;
            document.getElementById("add").innerHTML="The sum of both numbers is"+" "+add;


            var sub=a-b;
            document.getElementById("sub").innerHTML = "The difference between both numbers is" + " " + sub;

             
             var mult=a*b;
               document.getElementById("mult").innerHTML = "The number we get after multiplying both numbers is:" + " " + mult;

               var div=a/b;
               document.getElementById("div").innerHTML = "The number we get after dividing both numbers is:" + " " + div;






            






        </script>
        
    </body>
</html>
