<!--
1) Start the HTML document.
   a) Use `<!DOCTYPE html>` to define the page as an HTML5 document.
   b) Open the `<html>` tag.

2) Create the head section.
   a) Set the page title as "My Pet Page".
   b) Add internal CSS using the `<style>` tag.

3) Style the main page body.
   a) Set the font family to Arial.
   b) Add a light yellow background colour.
   c) Add padding around the page.
   d) Set a minimum height so the page can scroll.

4) Style the headings.
   a) Use `h1, h2` to target both headings.
   b) Set the heading colour to dark orange.

5) Create a fixed top bar.
   a) Use `.top-bar` to target the top navigation bar.
   b) Set `position: fixed` to keep it at the top.
   c) Set `top`, `left`, and `right` to stretch it across the page.
   d) Add background colour, text colour, and padding.

6) Style the list items.
   a) Use `.list-item` for pet information rows.
   b) Add a white background.
   c) Add a border, padding, and margin.

7) Create a relative note.
   a) Use `.special-note` to target the note.
   b) Set `position: relative`.
   c) Move it slightly to the right using `left`.
   d) Add background colour and padding.

8) Create the pet card.
   a) Use `.pet-card` to target the card.
   b) Set `position: relative`.
   c) Add background colour, border, and padding.

9) Add an absolute badge.
   a) Use `.badge` to target the badge.
   b) Set `position: absolute`.
   c) Place it in the top-right corner of the pet card.
   d) Add background colour, text colour, and padding.

10) Create a sticky section label.
   a) Use `.section-label` to target the label.
   b) Set `position: sticky`.
   c) Use `top` to decide where it sticks while scrolling.
   d) Add background colour, text colour, padding, and margin.

11) Add the page content.
   a) Add the fixed top bar.
   b) Add the main heading for Buddy.
   c) Add sections for static, relative, absolute, and sticky positioning.
   d) Add pet details and more available pets.

12) Close the `<body>` and `<html>` tags to complete the webpage.
