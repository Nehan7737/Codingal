<html>

<head>
    <title>Book Donation Form</title>
</head>

<body>
    <h1>Book Donation Form:</h1>

    <fieldset>
        <legend>Personal Information:</legend>
        <label>Enter your name</label><br>
        <input type="text"><br><br>
        <label>Enter you ID pin:</label><br>
        <input type="password"><br><br>
    </fieldset>
    <fieldset>
        <legend>Book Details:</legend>
        <label>Enter the main theme of the book:</label><br>
        <textarea placeholder="...Details To Be Added..."></textarea><br><br>
        <label>Choose the theme:</label><br><br>

        <label>Select the condition of the book:</label><br>
        <input type="radio" name="condition"> New<br>
        <input type="radio" name="condition">Good<br>
        <input type="radio" name="condition">Used<br><br><br>


        <select>
            <option>Select the category</option><br>
            <option value="Fiction">Fiction</option><br>
            <option value="History">History</option><br>
            <option value="Education">Education</option><br><br>

          


        </select><br><br>
        <label>Preferred Drop-off:</label><br><br>
        <input type="checkbox"> Monday <br><br>
        <input type="checkbox"> Thursday<br><br>
        <input type="checkbox"> Saturday<br><br>

    </fieldset><br>
    <button>Submit</button>

</body>

</html>
