<html>
    <head>
        <title>Forms in Html</title>
    </head>
    <body>
        <h1>ADoctor' Appointment:</h1>

    <fieldset>
        <legend>Personal Information:</legend>
        <label>Enter your name</label><br>
        <input type="text"><br><br>
        <label>Date of birth:</label><br>
        <input type="date"><br><br>
        <label>Enter you ID pin:</label><br>
        <input type="password"><br><br>
        <label>Choose Your Gender:</label><br>
            <input type="radio" name="Gender"> Male
            <input type="radio" name="Gender">Female</input>
    </fieldset>
    <fieldset>
        <legend>inquiries for visit:</legend>
        <label>Enter your health issues and previous medical records:</label>
        <textarea placeholder="Type your issue"></textarea><br><br>
<label>Choose The Doctor:</label><br>
<select>
    <option>Select a Doctor</option>
    <option>Dr Rachel : General</option>
    <option>Dr Jane : Eyes</option>
    <option>Dr Emanuel : Skin</option>
    
</select><br><br>
<label>Choose your Illness:</label><br><br>
<input type="checkbox"> Fever <br><br>
<input type="checkbox"> Eyesight Issues<br><br>
<input type="checkbox"> Joint Pain<br><br>

    </fieldset><br>
<button>Submit</button>

    </body>
</html>
