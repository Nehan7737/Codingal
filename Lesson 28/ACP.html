<html>

<head>
    <titleTask Organizer</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<style>
    .body {
        background: lavender;
    }

    .h1 {
        color: dark violet;
    }

    .h2 {
        color: dark violet;
    }

    .box {
        text-align: center;
        background: white;
        color: rgb(243, 110, 9);

    }
</style>

<body>
    <div class="container py-4">
        <h1>My Daily Task Organizer</h1>
        <p>Sort and label your daily tasks using JavaScript array methods.</p>

        <div class="card mb-4">
            <div class="card-body">
                <h3 class="card-title">Daily Tasks</h3>

                <button class="btn btn-primary" onclick="sortAZ()">sort A-Z </button>
                <button class="btn btn-primary" onclick="sortZA()">sort Z-A </button>

                <div id="name-result" class="box p-3 mt-3 rounded"></div>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-body">
                <h3 class="card-title">Task Time Needed:</h3>

                <button class="btn btn-primary" onclick="sortleast()">Shortest First  </button>
                <button class="btn btn-primary" onclick="sortmost()">Longest First </button>

                <div id="count-result" class="box p-3 mt-3 rounded"></div>
            </div>
        </div>



    </div>

    <script>
        var song = ['Homework', 'Breakfast', 'Exercise', 'Reading', 'Packing Bag']

        var plays = [123, 34, 56, 76, 28]
        document.getElementById("plays-result").innerHTML = "playes" + plays

        function sortleast() { plays.sort(function (a, b) { return a - b; }); document.getElementById("count-result").innerHTML = "Least played first: " + plays; }

        function sortmost() {
            plays.sort(function (a, b) { return b - a; }); document.getElementById("count-result").innerHTML = "Most played first: " + plays;
        }



        document.getElementById("name-result").innerHTML = "songs" + song
        function sortAZ() {

            song.sort();

            document.getElementById("name-result").innerHTML = "A-Z" + song;
        }

        function sortZA() {

            song.sort();
            song.reverse();

            document.getElementById("name-result").innerHTML = "Z-A" + song;
        }






    </script>


</body>

</html>
