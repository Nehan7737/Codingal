<html>
    <head>
        <title>Validation in JS</title>
        <style>

        body{
            background: #6eb688;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            padding: 30 px;
        }

        h1{
            color: coral;

        }

        input{

            padding:10px;
            margin: 8px;
            border:2px solid rgb(215, 215, 7) ;
            border-radius: 7px;
            width: 300px;
        }

        button{
            background: #ec9005;
            color: black;
            padding:35px;
            border: none;
            border-radius: 13px;
        }

        #timer{
            color: grey;
        }


            
        </style>
    </head>
    <body>

        <h1>Number Guesser:</h1>
        <p>This page lets you enter a number and shows if your guess was right!</p>

        <input type="name" id="name" placeholder="Enter your name" required><br>
        <p id="msg-name"></p>

        <input type="number" id="guess" placeholder="guess a number" min="1" max="5" required><br>
        <p id="msg-guess"></p>

        <button onclick="checkform()">Try My Luck!</button>
        <p id="result"></p>
        <p id="timer"></p>

        <script>

            var seconds=0;
            setInterval(function() {
                seconds = seconds+1;
                document.getElementById("timer").textContent="You have been here for" + seconds +"seconds"; 

            }, 1000);
function checkform() {

    var name=document.getElementById("name").value;
     var guess = document.getElementById("guess").value;
     var ok=true;

     if(name==""){
        document.getElementById("msg-name").textContent="Please enter your name";
         document.getElementById("msg-name").style.color="red";
         ok=false;
     }

     else{
        document.getElementById("msg-name").textContent = "Great Name";
        document.getElementById("msg-name").style.color="Green";

        
     }

    if (guess == "") {
        document.getElementById("msg-guess").textContent = "Please enter your guess";
        document.getElementById("msg-guess").style.color = "red";
        ok = false;
    }

    else {
        document.getElementById("msg-guess").textContent = "Guess Saved";
        document.getElementById("msg-guess").style.color = "Green";


    }
    if (ok == true) {

        var lucky = Math.floor(Math.random() * 5) + 1;

        if (guess == lucky) {

            document.getElementById("result").textContent = "You win, " + name + "! The lucky number was " + lucky + "!";

            document.getElementById("result").style.color = "green";

        } else {

            document.getElementById("result").textContent = "So close, " + name + "! The lucky number was " + lucky + ". Try again!";

            document.getElementById("result").style.color = "navy";

        }

    }

}




        </script>

    </body>
</html>
